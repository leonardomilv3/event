name: CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: leonardomilv3/eventing-api

jobs:
  build-and-push:
    name: Build Quarkus + Docker + Push
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build Quarkus sem testes
        working-directory: ./api
        run: |
          ./mvnw -B clean package -Dmaven.test.skip=true

      - name: Verificar artefato Quarkus
        working-directory: ./api
        run: |
          test -f target/quarkus-app/quarkus-run.jar
          test -d target/quarkus-app/lib
          echo "Artefato Quarkus encontrado:"
          du -sh target/quarkus-app

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:1.1
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-render:
    name: Deploy no Render
    needs: build-and-push
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy no Render
        run: |
          curl --fail-with-body \
            --show-error \
            --silent \
            -X POST \
            "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}"

      - name: Aguardar Render subir
        run: |
          for i in {1..30}; do
            echo "Tentativa $i/30..."

            if curl --fail --silent \
              https://eventing-api.onrender.com/q/health/ready; then
              echo
              echo "Aplicação está saudável."
              exit 0
            fi

            sleep 10
          done

          echo "Aplicação não ficou saudável a tempo."
          exit 1