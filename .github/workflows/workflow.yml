name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        working-directory: ./api
        run: ./mvnw -B clean verify

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            leonardomilv3/eventing-api:1.1
            leonardomilv3/eventing-api:${{ github.sha }}

  deploy-render:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy no Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Aguardar boot e validar health
        run: |
          sleep 60
          curl -f https://eventing-api.onrender.com/q/health/ready || exit 1