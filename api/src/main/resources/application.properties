# ─────────────────────────────────────────────────────────────────────────────
# Eventing API — Application Properties
# Perfis: %dev (local), %staging, %prod
# ─────────────────────────────────────────────────────────────────────────────

# ─── HTTP ────────────────────────────────────────────────────────────────────
quarkus.http.port=8080

# ─── Datasource ──────────────────────────────────────────────────────────────
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:eventing}
%prod.quarkus.datasource.password=${DB_PASSWORD:eventing}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres:5432/eventing}

# ─── Hibernate ORM ───────────────────────────────────────────────────────────
# validate: Flyway gerencia o schema; Hibernate apenas verifica a consistência
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.database.generation=none

# ─── Flyway ──────────────────────────────────────────────────────────────────
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.locations=classpath:db/migration
%prod.quarkus.flyway.baseline-on-migrate=true

# ─── Redis ───────────────────────────────────────────────────────────────────
%prod.quarkus.redis.hosts=${REDIS_URL:redis://redis:6379}

# ─── JWT ─────────────────────────────────────────────────────────────────────
mp.jwt.verify.issuer=https://eventing.com
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://eventing.com
# 86400s = 1 dia
smallrye.jwt.new-token.lifespan=86400

# ─── CORS ────────────────────────────────────────────────────────────────────
%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
%prod.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# ─── OpenAPI / Swagger UI ────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
%dev.quarkus.smallrye-openapi.path=/q/openapi

quarkus.smallrye-openapi.info-title=Eventing API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST do Eventing — plataforma de eventos urbanos

# ─── Logging ─────────────────────────────────────────────────────────────────
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.category."com.eventing".level=DEBUG
%dev.quarkus.log.category."io.quarkus".level=INFO
quarkus.log.level=INFO

# ─── Container image (quarkus-container-image-docker) ────────────────────────
quarkus.container-image.group=eventing
quarkus.container-image.name=eventing-api

# ─── Jackson ─────────────────────────────────────────────────────────────────
# Omitir campos null da serialização JSON
quarkus.jackson.serialization-inclusion=non-null
