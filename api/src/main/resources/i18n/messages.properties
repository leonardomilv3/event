# ── Generic ─────────────────────────────────────────────────────────────
error.notFound                  = Not found
error.unauthorized              = Unauthorized
error.forbidden                 = Access denied
error.badRequest                = Invalid request
error.conflict                  = Conflict
error.internal                  = Internal server error
error.validation                = Validation error
error.resourceExists            = Resource already exists
error.resourceNotFound          = Resource not found

# ── Auth ────────────────────────────────────────────────────────────────
error.auth.invalidCredentials   = Incorrect email or password
error.auth.emailTaken           = Email already registered
error.auth.usernameTaken        = Username already in use
error.auth.weakPassword         = Password does not meet requirements

