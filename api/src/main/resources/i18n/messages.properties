error.event.endsAtRequired      = End date is required
error.event.endBeforeStart      = End date must be after start date
error.event.full                = Event has reached its maximum capacity

# ── Participant ─────────────────────────────────────────────────────────
error.participant.notFound      = Participant not found
error.participant.alreadyJoined = User is already a participant of this event
error.participant.notPublic     = This event does not accept participation requests
error.participant.notParticipant = User is not a participant of this event

# ── Social ──────────────────────────────────────────────────────────────
error.social.cannotFollowSelf   = You cannot follow yourself
error.social.alreadyFollowing   = You are already following this user
error.social.notFollowing       = You are not following this user

