# ── Genéricos ───────────────────────────────────────────────────────────
error.notFound                  = Não encontrado
error.unauthorized              = Não autorizado
error.forbidden                 = Acesso negado
error.badRequest                = Requisição inválida
error.conflict                  = Conflito
error.internal                  = Erro interno do servidor
error.validation                = Erro de validação
error.resourceExists            = Recurso já existe
error.resourceNotFound          = Recurso não encontrado

# ── Auth ────────────────────────────────────────────────────────────────
error.auth.invalidCredentials   = E-mail ou senha incorretos
error.auth.emailTaken           = E-mail já cadastrado
error.auth.usernameTaken        = Nome de usuário já em uso
error.auth.weakPassword         = A senha não atende aos requisitos

# ── Event ───────────────────────────────────────────────────────────────
error.event.notFound            = Evento não encontrado
error.event.notOwner            = Você não é o dono deste evento
error.event.alreadyPublished    = O evento já está publicado
error.event.notPublished        = Evento não está publicado
error.event.notDraft            = Somente eventos em DRAFT podem ser publicados
error.event.endsAtRequired      = A data de término é obrigatória
error.event.endBeforeStart      = A data de término deve ser posterior à data de início
error.event.full                = O evento atingiu a capacidade máxima

# ── Participant ─────────────────────────────────────────────────────────
error.participant.notFound      = Participante não encontrado
error.participant.alreadyJoined = Usuário já é participante deste evento
error.participant.notPublic     = Este evento não aceita pedidos de participação
error.participant.notParticipant = Usuário não é participante deste evento

# ── Social ──────────────────────────────────────────────────────────────
error.social.cannotFollowSelf   = Você não pode seguir a si mesmo
error.social.alreadyFollowing   = Você já segue este usuário
error.social.notFollowing       = Você não segue este usuário

# ── Resource keys (resolvidas por ApiException.notFound) ───────────────
error.follow.notFound           = Relação de follow não encontrada
error.user.notFound             = Usuário não encontrado
error.user.usernameTaken        = Nome de usuário já em uso