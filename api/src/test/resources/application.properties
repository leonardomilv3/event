# Conecta ao PostgreSQL+PostGIS do docker-compose (porta 5432 local)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/eventing
quarkus.datasource.username=eventing
quarkus.datasource.password=eventing
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.hibernate-orm.database.generation=none

# Redis local do docker-compose
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false

# JWT — chaves de teste já existem em src/main/resources
mp.jwt.verify.issuer=https://eventing.com
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://eventing.com
smallrye.jwt.new-token.lifespan=86400
