server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compressão gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── SPA Routing ────────────────────────────────────────────────────────
    # Todas as rotas do React Router v6 (/, /events, /events/:id, /dashboard)
    # devem servir index.html para que o roteamento client-side funcione após
    # refresh ou acesso direto por URL.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── Assets estáticos — cache agressivo ─────────────────────────────────
    # Vite gera hashes nos nomes de arquivo (ex: index-B3kpMwSv.js),
    # portanto cache imutável de 1 ano é seguro.
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
